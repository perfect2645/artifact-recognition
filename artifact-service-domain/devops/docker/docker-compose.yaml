services:
  artifact-api:
    image: artifact-api:dev
    container_name: artifact-api

    ports:
      - "127.0.0.1:5001:8081"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: ""
      Kestrel__Endpoints__Https__Url: "https://0.0.0.0:8081"
      Kestrel__Endpoints__Https__Certificate__Path: "/https/${CERTIFICATE_NAME:-localhost-artifact.pfx}"

    volumes:
      - type: bind
        source: ../../appsettings.Development.json
        target: /app/appsettings.Development.json
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ../../Configurations/certs/${CERTIFICATE_NAME:-localhost-artifact.pfx}
        target: /https/${CERTIFICATE_NAME:-localhost-artifact.pfx}
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ../../container-logs
        target: /app/logs
        bind:
          create_host_path: false
